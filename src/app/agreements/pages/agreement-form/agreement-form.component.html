<p-dialog
  [(visible)]="visible"
  [style]="{ width: '50rem' }"
  [header]="
    agreement ? 'Editar Acuerdo No. ' + agreement.number : 'Crear Acuerdo'
  "
  [modal]="true"
  [focusOnShow]="false"
  styleClass="p-fluid"
  [draggable]="false"
  (onHide)="hideDialog()"
>
  <pre>
  {{ agreementForm.value | json }}
</pre
  >
  <ng-template pTemplate="content">
    <div class="flex flex-column">
      <form class="form" [formGroup]="agreementForm" autocomplete="off">
        <!-- contenido -->
        <div class="field">
          <label for="content" class="">Contenido del acuerdo: </label>

          <input
            type="text"
            pInputText
            id="content"
            formControlName="content"
            placeholder="Contenido del acuerdo..."
          />

          <small
            id="content-help"
            class="flex p-error"
            *ngIf="validate('content')"
            >{{ contentErrorMsg }}</small
          >
        </div>

        <!-- fin contenido -->

        <!-- 2 columnas -->
        <div class="flex flex-row">
          <!-- izquierda -->
          <div class="flex flex-column col">
            <!-- fecha de cumplimiento -->
            <div class="field">
              <label for="complianceDate" class=""
                >Fecha de cumplimiento:
              </label>

              <p-calendar
                [iconDisplay]="'input'"
                [showIcon]="true"
                inputId="complianceDate"
                dateFormat="dd/mm/yy"
                appendTo="body"
                formControlName="compilanceDate"
                [touchUI]="true"
                [readonlyInput]="true"
              />

              <small
                id="compilanceDate-help"
                class="flex p-error"
                *ngIf="validate('compilanceDate')"
                >{{ compilanceDateErrorMsg }}</small
              >
            </div>
            <!-- fin fecha de cumplimiento -->
          </div>
          <!-- fin izquierda -->

          <!-- derecha -->
          <div class="flex flex-column col">
            <!-- creator -->
            <!-- FIXME: sustituir x inputtext del usuario logeado -->
            <!-- <div class="grid">
                <div class="col-4"></div>
    
                <small
                  id="createdBy-help"
                  class="p-error col pt-0 ml-2"
                  *ngIf="validate('createdBy')"
                  >{{ createdByErrorMsg }}</small
                >
              </div> -->
            <!-- fin creator -->

            <!-- responsible -->
            <div class="field">
              <label for="responsible" class="">Responsable: </label>

              <p-dropdown
                id="responsible"
                [options]="workers"
                optionLabel="name"
                optionValue="id"
                formControlName="responsible"
                placeholder="-- Seleccione --"
                appendTo="body"
              />

              <small
                id="responsible-help"
                class="flex p-error mr-5"
                *ngIf="validate('responsible')"
                >{{ responsibleErrorMsg }}</small
              >
            </div>
            <!-- fin responsible -->

            <!-- checkbox -->
            <!-- <div class="flex gap-1 mt-3" *ngIf="showCheck">
                <div class="flex w-4"></div>
                <div class="flex field-checkbox">
                  <p-checkbox
                    class="flex align-items-center"
                    inputId="completed"
                    [binary]="true"
                    formControlName="completed"
                  ></p-checkbox>
                  <label for="completed" class="flex align-items-center"
                    >Cumplido</label
                  >
                </div>
              </div> -->
            <!-- fin checkbox -->
          </div>
          <!-- fin derecha -->
        </div>
        <!-- fin 2 columnas -->

        <!-- answer -->
        <!-- <div class="flex gap-1 mt-2" *ngIf="showAnswer">
            <label
              for="answer"
              class="flex w-2 align-items-center justify-content-end pr-1"
              >Respuesta:
            </label>
    
            <textarea
              class="flex w-10 mr-1"
              pInputTextarea
              [autoResize]="true"
              id="answer"
              formControlName="answer"
              placeholder="Respuesta..."
            ></textarea>
          </div> -->
        <!-- fin answer -->
      </form>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="flex pt-4 justify-content-evenly">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        [text]="true"
        (onClick)="hideDialog()"
      />

      <p-button
        label="Guardar"
        icon="pi pi-check"
        [text]="true"
        (onClick)="save()"
      />
    </div>
  </ng-template>
</p-dialog>

<pre>
  {{ agreementForm.value | json }}
</pre>
