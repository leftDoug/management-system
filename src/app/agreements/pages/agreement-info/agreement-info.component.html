<div class="flex align-items-center justify-content-center">
  <p-card class="p-5 w-full">
    <p-toast></p-toast>
    <div class="">
      <h1 class="flex gap-3 mt-0 ml-5">
        Acuerdo {{ agreement.number }}
        <p-tag
          [severity]="setSeverity(status)"
          [value]="status"
          class="flex align-self-center"
        />
      </h1>

      <p-divider align="left" type="solid">
        <strong>Contenido</strong>
      </p-divider>
      <p class="ml-5">{{ agreement.content }}</p>

      <div class="grid">
        <div class="col">
          <p-divider align="left" type="solid">
            <strong>Reunión</strong>
          </p-divider>
          <p class="ml-5">{{ agreement.meeting }}</p>
        </div>
      </div>

      <div class="grid">
        <div class="col">
          <p-divider align="left" type="solid">
            <strong>Fecha de cumplimiento</strong>
          </p-divider>
          <p class="ml-5">
            {{ agreement.compilanceDate | date : "MM/dd/yyyy" }}
          </p>
        </div>

        <div class="col">
          <p-divider align="left" type="solid">
            <strong>Responsable</strong>
          </p-divider>
          <p class="ml-5">{{ agreement.responsible }}</p>
        </div>
      </div>

      <p-divider align="left" type="solid">
        <strong>Respuestas</strong>
      </p-divider>
      <p class="ml-5"></p>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex gap-3 justify-content-center">
        <p-button
          icon="pi pi-pencil"
          label="Editar"
          severity="success"
          type="button"
          *ngIf="!agreement.completed && agreement.state"
          [routerLink]="['/acuerdos/editar/', agreement.id]"
        ></p-button>
        <p-button
          icon="pi pi-times"
          label="Cancelar"
          type="button"
          routerLink="/acuerdos"
        ></p-button>
        <p-button
          icon="pi pi-ban"
          label="Anular"
          severity="danger"
          type="button"
          *ngIf="!agreement.completed && agreement.state"
          (onClick)="cancel()"
        ></p-button>
      </div>
    </ng-template>
    <p-confirmDialog></p-confirmDialog>
  </p-card>
</div>
