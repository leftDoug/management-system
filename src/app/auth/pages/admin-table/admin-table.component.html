<div class="flex flex-wrap align-items-center justify-content-center">
  <div class="p-5 w-full">
    <p-card class="min-w-700" header="Listado de Usuarios">
      <p-toast />
      <p-table
        #tUsers
        [value]="users"
        [tableStyle]="{ 'min-width': '60rem' }"
        [globalFilterFields]="['username', 'worker', 'role']"
      >
        <ng-template pTemplate="caption">
          <div class="flex justify-content-between">
            <p-button
              label="Agregar Usuario"
              icon="pi pi-plus"
              severity="success"
              (onClick)="showDialog()"
            ></p-button>
            <span class="p-input-icon-left ml-5">
              <i class="pi pi-search"></i>
              <input
                pInputText
                type="text"
                placeholder="Buscar..."
                ngClass="search"
                (input)="
                  tUsers.filterGlobal($any($event.target).value, 'contains')
                "
              />
            </span>
          </div>
        </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="username">
              Usuario <p-sortIcon field="username"></p-sortIcon>
            </th>
            <th pSortableColumn="idWorker">
              Trabajador <p-sortIcon field="idWorker"></p-sortIcon>
            </th>
            <th pSortableColumn="idRole">
              Rol <p-sortIcon field="idRole"></p-sortIcon>
            </th>
            <th style="width: 5%"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
          <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.worker }}</td>
            <td>{{ user.role }}</td>
            <td>
              <div class="flex align-items-center justify-content-center">
                <p-button
                  icon="pi pi-info-circle"
                  label="Info"
                  [text]="true"
                  [routerLink]="['/usuarios/detalles/', user.id]"
                ></p-button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-danger">
              No se encontró ningún usuario.
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="card">
        <!-- <p-toast /> -->

        <form [formGroup]="userForm" class="form">
          <p-dialog
            [(visible)]="registerDialog"
            [style]="{ width: '450px' }"
            header="Registrar Usuario"
            [modal]="true"
            [closable]="false"
            styleClass="p-fluid"
          >
            <p-messages
              [(value)]="msgRegister"
              [enableService]="false"
            ></p-messages>
            <ng-template pTemplate="content">
              <div class="field">
                <label for="worker">Trabajador</label>

                <p-dropdown
                  inputId="worker"
                  formControlName="idWorker"
                  [options]="workers"
                  optionLabel="name"
                  (onHide)="touchDropdown()"
                  optionValue="id"
                  placeholder="-- Seleccione --"
                />

                <small class="p-error" *ngIf="worker.errors && dropdownTouched">
                  El trabajador es requerido.
                </small>
              </div>

              <div class="field">
                <label for="role">Rol</label>

                <p-dropdown
                  inputId="role"
                  formControlName="idRole"
                  [options]="roles"
                  optionLabel="role"
                  optionValue="id"
                />
              </div>

              <div class="field">
                <label for="username">Usuario</label>

                <input
                  id="username"
                  pKeyFilter="alphanum"
                  pInputText
                  formControlName="username"
                />

                <small
                  class="p-error"
                  *ngIf="username.errors && username.touched"
                >
                  {{ getUsernameErrorMsg() }}.
                </small>
              </div>

              <div class="field">
                <label for="password">Contraseña</label>

                <p-password
                  inputId="password"
                  formControlName="password"
                  [toggleMask]="true"
                  [feedback]="false"
                  (onBlur)="touchPassword()"
                />
                <small
                  class="p-error"
                  *ngIf="password.errors && passwordTouched"
                >
                  {{ getPasswordErrorMsg() }}.
                </small>
              </div>

              <div class="field">
                <label for="checkPassword">Confirmar contraseña</label>

                <p-password
                  inputId="checkPassword"
                  formControlName="checkPassword"
                  [toggleMask]="true"
                  [feedback]="false"
                  (onBlur)="touchCheckPassword()"
                />
                <small
                  class="p-error"
                  *ngIf="checkPassword.errors && checkPasswordTouched"
                >
                  {{ getCheckPasswordErrorMsg() }}.
                </small>
              </div>
            </ng-template>

            <ng-template pTemplate="footer">
              <p-button
                label="Atrás"
                [text]="true"
                (onClick)="hideRegisterDialog()"
              />

              <p-button
                label="Registrarse"
                severity="success"
                icon="pi pi-user-plus"
                [text]="true"
                [disabled]="userForm.invalid"
                (onClick)="register()"
              />
            </ng-template>
          </p-dialog>
        </form>

        <!-- <p-confirmDialog [style]="{ width: '450px' }" /> -->
      </div>

      <!-- <pre>{{ dropdownBlurred }}</pre> -->

      <!-- <p-confirmDialog></p-confirmDialog> -->
    </p-card>
  </div>
</div>

<pre>{{ users | json }}</pre>
