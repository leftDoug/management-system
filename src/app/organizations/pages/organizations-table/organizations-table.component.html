<div class="flex flex-wrap align-items-center justify-content-center">
  <div class="p-3 w-full">
    <p-card class="min-w-700" header="Organizaciones">
      <p-toast />

      <!-- XXX sortFunction y customSort son para quitar el ordenamiento -->
      <p-table
        #tOrganizations
        [value]="organizations"
        [globalFilterFields]="['name', 'leader']"
        [tableStyle]="{ 'min-width': '60rem' }"
        [paginator]="true"
        [rows]="5"
        [rowHover]="true"
        [rowsPerPageOptions]="[5, 10, 15]"
        (sortFunction)="customSort($event)"
        [customSort]="true"
      >
        <ng-template pTemplate="caption">
          <div class="flex justify-content-between">
            <p-button
              [text]="true"
              label="Crear Organización"
              icon="pi pi-plus"
              severity="success"
              (onClick)="openNew(null)"
            />

            <span class="p-input-icon-left ml-5">
              <i class="pi pi-search"></i>

              <input
                pInputText
                type="text"
                ngClass="search"
                (input)="
                  tOrganizations.filterGlobal(
                    $any($event.target).value,
                    'contains'
                  )
                "
                placeholder="Buscar..."
              />
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name" style="width: 70%">
              Organización <p-sortIcon field="name"></p-sortIcon>
            </th>

            <th pSortableColumn="leader" style="width: 20%">
              Líder <p-sortIcon field="leader"></p-sortIcon>
            </th>

            <th style="width: 10%"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-organization>
          <tr>
            <td>{{ organization.name }}</td>

            <td>{{ organization.leader }}</td>

            <td class="flex gap-2">
              <p-button
                icon="pi pi-info-circle"
                [text]="true"
                [rounded]="true"
                [routerLink]="['/organizaciones/info/', organization.id]"
              />
              <!-- (onClick)="openNew(organization.id)" -->

              <p-button
                icon="pi pi-pencil"
                severity="success"
                [text]="true"
                [rounded]="true"
                (onClick)="openNew(organization.id)"
              />
              <!-- [routerLink]="['/organizaciones/editar/', organization.id]" -->

              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                [rounded]="true"
                (onClick)="remove($event, organization.id)"
              />
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-danger">
              No se encontró ninguna organización.
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="summary">
          <div class="row">
            <span class="col text-center"
              >Organizaciones:
              {{ organizations ? organizations.length : 0 }}</span
            >
          </div>
        </ng-template>
      </p-table>
      <p-confirmDialog></p-confirmDialog>
    </p-card>
  </div>

  <p-dialog
    [(visible)]="organizationDialog"
    [style]="{ width: '50rem' }"
    header="Crear Organización"
    [modal]="true"
    styleClass="p-fluid"
    (onHide)="hideDialog()"
  >
    <ng-template pTemplate="content">
      <p-stepper [linear]="true">
        <p-stepperPanel header="Nombre y Líder">
          <ng-template
            pTemplate="content"
            let-nextCallback="nextCallback"
            let-index="index"
          >
            <div class="flex flex-column">
              <form [formGroup]="organizationForm" class="form">
                <div class="field">
                  <label for="name">Nombre:</label>

                  <input
                    type="text"
                    pInputText
                    id="name"
                    formControlName="name"
                    autofocus
                  />

                  <small class="p-error" *ngIf="submitted && name.errors">
                    {{ getNameErrorMsg() }}
                  </small>
                </div>

                <div class="field">
                  <label for="leader">Líder:</label>

                  <p-dropdown
                    formControlName="idLeader"
                    inputId="leader"
                    [options]="workers"
                    optionLabel="name"
                    optionValue="id"
                    placeholder="--Seleccione--"
                    (onHide)="leader.markAllAsTouched()"
                    appendTo="body"
                  />

                  <small class="p-error" *ngIf="submitted && leader.errors">
                    {{ getLeaderErrorMsg() }}
                  </small>
                </div>
              </form>
            </div>

            <div class="flex pt-4 justify-content-end">
              <p-button
                label="Siguiente"
                [text]="true"
                icon="pi pi-arrow-right"
                iconPos="right"
                (onClick)="submit()"
                (onClick)="organizationForm.valid && nextCallback.emit()"
              />
            </div>
          </ng-template>
        </p-stepperPanel>

        <p-stepperPanel header="Integrantes">
          <ng-template
            pTemplate="content"
            let-prevCallback="prevCallback"
            let-nextCallback="nextCallback"
            let-index="index"
          >
            <!-- FIXME: ver de k manera se puede hacer k se vea normal el mensaje -->
            <p-messages key="selected" />

            <div class="flex flex-column">
              <p-pickList
                [source]="workersSource"
                [target]="workersSelected"
                sourceHeader="Trabajadores disponibles"
                targetHeader="Trabajadores seleccionados"
                [responsive]="true"
                [showSourceControls]="false"
                [showTargetControls]="false"
                [sourceStyle]="{ height: '10rem' }"
              >
                <ng-template let-worker pTemplate="item">
                  <div class="">
                    <span class="font-bold">{{ worker.name }}</span>
                  </div>
                </ng-template>
              </p-pickList>
            </div>

            <div class="flex pt-4 justify-content-between">
              <p-button
                label="Anterior"
                [text]="true"
                icon="pi pi-arrow-left"
                (onClick)="clearSelectedWorkers()"
                (onClick)="prevCallback.emit()"
              />

              <p-button
                label="Guardar"
                icon="pi pi-check"
                [text]="true"
                (onClick)="saveOrganization()"
              />
            </div>
          </ng-template>
        </p-stepperPanel>
      </p-stepper>
